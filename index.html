      line-height: 1.6;
      color: #e7f0f7;

    .headline-icon {

      line-height: 1;

    .summary-title {

      font-weight: 700;
      line-height: 1.45;

      overflow: hidden;
      position: relative;

      height: 100%;

      left: 0;
      background: linear-gradient(90deg, #1f8f56, var(--green));
    }
    .mini-gauge-neg {
      right: 0;
      background: linear-gradient(90deg, var(--red), #9f2d2d);
    }
    .gauge-caption {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;

    .news-one-line {
      margin-top: 8px;

      line-height: 1.6;
      color: #d9e5ef;
    }
    .show-more {

      width: 100%;

      gap: 10px;
      margin-top: 14px;

      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 2px;

      color: var(--muted);
      margin-bottom: 6px;
    }
    .signal-panel .main {

      font-weight: 800;
      line-height: 1.2;

      font-size: 12px;
      color: #d5e1ec;
      line-height: 1.6;

      align-items: center;

    .bar-label {

      color: #dfe9f3;

      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      height: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .bar-value {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .donut {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: relative;
      flex: 0 0 96px;
    }
    .donut::after {
      content: "";
      position: absolute;
      inset: 18px;
      background: var(--panel);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .legend {
      display: grid;
      gap: 8px;
      min-width: 160px;
    }
    .legend-item {

      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #dce7f1;
    }

      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }

      font-weight: 800;
      line-height: 1.2;

      color: #d7e2ed;

      line-height: 1.15;

      color: #d7e2ed;

      gap: 8px;
      margin-top: 8px;

      height: 10px;

      gap: 8px;

      const posWidth = (safeBull / total) * 100;
      const negWidth = (safeBear / total) * 100;
      return `
        <div class="mini-gauge">
          <div class="mini-gauge-pos" style="width:${posWidth}%;"></div>
          <div class="mini-gauge-neg" style="width:${negWidth}%;"></div>
        </div>
        <div class="gauge-caption">
          <span>🟢 強気 ${safeBull}</span>
          <span>🔴 弱気 ${safeBear}</span>
        </div>
      `;
    }

        `var(--red) ${(pos / total) * 100}% ${((pos + neg) / total) * 100}%`,
        `var(--gray) ${((pos + neg) / total) * 100}% 100%`

      const topCats = [...payload.categories]

      const maxCount = Math.max(...topCats.map(item => item.news_count), 1);
      const topAlerts = (payload.alerts || []).slice(0, 3);

    function applyNewsFilters(news) {
      let rows = [...news];
      rows.sort((a, b) => String(b.published_at).localeCompare(String(a.published_at)));
      return rows;
    }

    function renderNewsList(news) {
      const rows = applyNewsFilters(news);
      const visible = rows.slice(0, 12);
      const remain = Math.max(rows.length - visible.length, 0);
      document.getElementById("news-list").innerHTML = `
      <div class="compact-list">
      ${visible.map(item => `
        <article class="news-item ${escapeHtml(item.sentiment)}">
          <div class="headline">

      ${remain > 0 ? `<button class="show-more" onclick="alert('残り ${remain} 件は一覧を圧縮表示しています。必要ならフィルタで絞ってください。')">残り ${remain} 件は圧縮</button>` : ""}
      `;
    }

    function loadDashboard(payload) {
      state.payload = payload;
      document.getElementById("updated-at").textContent = `更新: ${formatDateShort(payload.generated_at)}`;
      renderIranBriefing(payload.iran_briefing);
      renderBojBriefing(payload.boj_briefing);
      renderTopSummary(payload.summary);
      renderVisualSummary(payload);
      renderCategorySummary(payload.categories);
      renderWatchlist(payload.watchlist_impact);
      renderAlerts(payload.alerts);
      renderNewsList(payload.news);
    }

    async function triggerRefresh() {
      const status = document.getElementById("refresh-status");
      status.textContent = "ページを再読み込みしました";
      window.location.reload();
    }

    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
    });
    document.getElementById("refresh-button").addEventListener("click", triggerRefresh);
    loadDashboard(initialPayload);
  </script>
