    .primary { background: #113d2a; border-color: #1c6d49; }

      padding: 6px 10px;

      color: var(--text);

      border-radius: 2px;

    }

      gap: 8px;

      background: rgba(255,255,255,0.04);

    .bg-positive { background: rgba(51,209,122,0.16); color: #a9f1c7; border-color: rgba(51,209,122,0.32); }

    .bg-neutral { background: rgba(148,163,184,0.14); color: #d7e1ea; border-color: rgba(148,163,184,0.28); }
    .bg-high { background: rgba(255,191,105,0.16); color: #ffe0b3; border-color: rgba(255,191,105,0.28); }

      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .simple-box {

      border: 1px solid rgba(255,255,255,0.05);

    }

      color: var(--muted);
      margin-bottom: 6px;
    }
    .simple-box .value {
      font-size: 14px;
      line-height: 1.6;
      color: #e7f0f7;
    }
    .raw-link {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

      align-items: flex-start;
      gap: 10px;
    }

      height: 34px;

      border: 1px solid rgba(255,255,255,0.08);
      padding: 4px;
      flex: 0 0 34px;
    }
    .headline-icon {
      font-size: 22px;
      line-height: 1;
      margin-top: 2px;
    }
    .summary-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }
    .compact-list {
      display: grid;
      gap: 10px;
    }
    .mini-gauge {

      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .mini-gauge-pos, .mini-gauge-neg {
      position: absolute;
      top: 0;
      height: 100%;
    }
    .mini-gauge-pos {
      left: 0;
      background: linear-gradient(90deg, #1f8f56, var(--green));
    }
    .mini-gauge-neg {
      right: 0;
      background: linear-gradient(90deg, var(--red), #9f2d2d);
    }
    .gauge-caption {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .news-one-line {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #d9e5ef;
    }
    .show-more {
      margin-top: 12px;
      width: 100%;
    }
    .hero-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .signal-panel {
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 2px;
    }
    .signal-panel .kicker {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .signal-panel .main {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
    }
    .signal-panel .sub {
      margin-top: 6px;
      font-size: 12px;
      color: #d5e1ec;
      line-height: 1.6;
    }
    .bar-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 120px 1fr 54px;
      gap: 10px;
      align-items: center;
    }
    .bar-label {
      font-size: 12px;
      color: #dfe9f3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      height: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .bar-value {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .donut {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: relative;
      flex: 0 0 96px;
    }
    .donut::after {
      content: "";
      position: absolute;
      inset: 18px;
      background: var(--panel);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .legend {
      display: grid;
      gap: 8px;
      min-width: 160px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #dce7f1;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }

    .footer { margin-top: 12px; color: var(--muted); font-size: 12px; }

      gap: 8px;
      margin-top: 10px;

      width: 4px;
      background: var(--gray);

    .impact-tile.neutral::before { background: var(--gray); }

      color: var(--muted);

      margin-top: 6px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }
    .impact-tile .tiny {

      font-size: 11px;
      color: #d7e2ed;
      line-height: 1.5;
    }

      gap: 8px;
      margin-top: 10px;

      background: rgba(255,255,255,0.03);

      font-weight: 800;
      line-height: 1.15;

    .signal-chip .note {
      margin-top: 4px;
      font-size: 11px;
      color: #d7e2ed;
    }

      gap: 10px;
      margin-top: 10px;

      align-items: center;
      gap: 8px;
      margin-top: 8px;

      gap: 4px;

      width: 10px;
      height: 10px;

      background: rgba(255,255,255,0.1);

      gap: 12px;
      margin-top: 10px;

      display: grid;
      gap: 8px;
      margin-top: 10px;

      .toolbar > div { width: 100%; }
      button, select { width: 100%; }
      .briefing-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

        <div class="signal-chip">
          <div class="cap">${escapeHtml(icon)} ${escapeHtml(cap)}</div>
          <div class="val ${toneClass(tone)}">${escapeHtml(value)}</div>
          <div class="note">${escapeHtml(note)}</div>
        </div>
      `;
    }

    function heatDots(value, mode = "green") {
      const safe = Math.max(0, Math.min(5, Number(value || 0)));
      return `
        <span class="heat-dots">
          ${Array.from({ length: 5 }).map((_, idx) => `<span class="heat-dot ${idx < safe ? `on ${mode}` : ""}"></span>`).join("")}
        </span>
      `;
    }

    function setActiveTab(tabName) {
      document.querySelectorAll(".tab-button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.getElementById("tab-overview").classList.toggle("hidden", tabName !== "overview");
      document.getElementById("tab-news").classList.toggle("hidden", tabName !== "news");
      document.getElementById("tab-watchlist").classList.toggle("hidden", tabName !== "watchlist");
    }

    function gaugeHtml(bull, bear) {
      const safeBull = Math.max(0, Number(bull || 0));
      const safeBear = Math.max(0, Number(bear || 0));
      const total = Math.max(safeBull + safeBear, 1);
      const posWidth = (safeBull / total) * 100;
      const negWidth = (safeBear / total) * 100;
      return `
        <div class="mini-gauge">
          <div class="mini-gauge-pos" style="width:${posWidth}%;"></div>
          <div class="mini-gauge-neg" style="width:${negWidth}%;"></div>
        </div>
        <div class="gauge-caption">
          <span>🟢 強気 ${safeBull}</span>
          <span>🔴 弱気 ${safeBear}</span>
        </div>
      `;
    }

    function loadDashboard(payload) {
      state.payload = payload;
      document.getElementById("updated-at").textContent = `更新: ${formatDateShort(payload.generated_at)}`;
      renderIranBriefing(payload.iran_briefing);
      renderBojBriefing(payload.boj_briefing);
      renderTopSummary(payload.summary);
      renderVisualSummary(payload);
      renderCategorySummary(payload.categories);
      renderWatchlist(payload.watchlist_impact);
      renderAlerts(payload.alerts);
      renderNewsList(payload.news);
    }

    async function triggerRefresh() {
      const status = document.getElementById("refresh-status");
      status.textContent = "ページを再読み込みしました";
      window.location.reload();
    }

    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
    });
    document.getElementById("refresh-button").addEventListener("click", triggerRefresh);
    loadDashboard(initialPayload);
  </script>
</body>
</html>
