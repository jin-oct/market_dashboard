      color: #e7f0f7;

    .summary-title {

      font-weight: 700;

      height: 100%;

    .mini-gauge-neg {
      right: 0;
      background: linear-gradient(90deg, var(--red), #9f2d2d);
    }

      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);

      justify-content: space-between;
      gap: 8px;

    .news-one-line {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #d9e5ef;
    }

      width: 100%;
    }

      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 14px;

      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 2px;

      color: var(--muted);
      margin-bottom: 6px;
    }
    .signal-panel .main {

      font-weight: 800;
      line-height: 1.2;

      color: #d5e1ec;
      line-height: 1.6;

      gap: 10px;
      align-items: center;

    .bar-label {

    .bar-track {

      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .bar-value {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .donut {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: relative;
      flex: 0 0 96px;
    }
    .donut::after {
      content: "";
      position: absolute;
      inset: 18px;
      background: var(--panel);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }

      gap: 8px;
      min-width: 160px;
    }

      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #dce7f1;
    }

      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }

function renderVisualSummary(payload) {
      const news = payload.news || [];
      const pos = news.filter(item => item.sentiment === "positive").length;
      const neg = news.filter(item => item.sentiment === "negative").length;
      const neu = news.filter(item => item.sentiment === "neutral").length;
      const total = Math.max(pos + neg + neu, 1);
      const avgBull = Math.round(news.reduce((acc, item) => acc + (item.bullish_score || 0), 0) / total);
      const avgBear = Math.round(news.reduce((acc, item) => acc + (item.bearish_score || 0), 0) / total);
      const highImpact = news.filter(item => item.impact === "high").length;
      const alertCount = (payload.alerts || []).length;
      const caution = avgBear > avgBull ? "警戒寄り" : avgBull - avgBear >= 10 ? "強気寄り" : "中立";
      const sentimentStops = [
        `var(--green) 0 ${(pos / total) * 100}%`,
        `var(--red) ${(pos / total) * 100}% ${((pos + neg) / total) * 100}%`,
        `var(--gray) ${((pos + neg) / total) * 100}% 100%`
      ].join(", ");
      const topCats = [...payload.categories]
        .sort((a, b) => b.news_count - a.news_count)
        .slice(0, 5);
      const maxCount = Math.max(...topCats.map(item => item.news_count), 1);
      const topAlerts = (payload.alerts || []).slice(0, 3);
      const poly = payload.polymarket_sentiment || {};
      const polyItems = poly.items || [];

      document.getElementById("visual-summary").innerHTML = `
        <article class="card" style="flex:1 1 420px;">
          <h3>一目サマリー</h3>
          <div class="hero-strip">
            <div class="signal-panel">
              <div class="kicker">市場トーン</div>
              <div class="main ${avgBear > avgBull ? "tone-negative" : avgBull > avgBear ? "tone-positive" : "tone-neutral"}">${escapeHtml(caution)}</div>
              <div class="sub">強気 ${avgBull} / 弱気 ${avgBear}</div>
            </div>
            <div class="signal-panel">
              <div class="kicker">重要ニュース</div>
              <div class="main">${highImpact}</div>
              <div class="sub">高インパクト件数</div>
            </div>
            <div class="signal-panel">
              <div class="kicker">警戒シグナル</div>
              <div class="main ${alertCount ? "tone-negative" : "tone-positive"}">${alertCount}</div>
              <div class="sub">${alertCount ? "要確認" : "大きな警戒なし"}</div>
            </div>
          </div>
          <div class="signal-panel" style="margin-top:12px;">
            <div class="kicker">Polymarket 市場センチメント</div>
            <div class="main ${poly.overall_tone === "positive" ? "tone-positive" : poly.overall_tone === "negative" ? "tone-negative" : "tone-neutral"}">${escapeHtml(poly.overall_label || "未取得")}</div>
            <div class="sub">予測市場ベース</div>
          </div>
          <div class="briefing-list" style="margin-top:10px;">
            ${(poly.summary_lines || []).map(line => `<div class="briefing-line">${escapeHtml(line)}</div>`).join("")}
          </div>
          <div class="simple-grid" style="margin-top:12px;">
            ${polyItems.map(item => `
              <a class="simple-box ${item.tone === "positive" ? "tone-positive" : item.tone === "negative" ? "tone-negative" : "tone-neutral"}" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">
                <div class="label">${escapeHtml(item.label)}</div>
                <div class="value">${escapeHtml(String(item.yes_probability))}%</div>
                <div class="muted">${escapeHtml(item.summary_hint || item.trend_label || "")}</div>
              </a>
            `).join("")}
          </div>
          <div class="briefing-list" style="margin-top:12px;">
            ${topAlerts.length ? topAlerts.map(item => `
              <div class="briefing-line">
                <strong>🚨 ${escapeHtml(item.label)}</strong><br>
                <span class="muted">${escapeHtml(item.reason || "")}</span>
              </div>
            `).join("") : `<div class="briefing-line">警戒シグナルはまだ強くありません。</div>`}
          </div>
        </article>
        <article class="card" style="flex:1 1 300px;">
          <h3>ポジネガ比率</h3>
          <div class="donut-wrap">
            <div class="donut" style="background: conic-gradient(${sentimentStops});"></div>
            <div class="legend">
              <div class="legend-item"><span class="legend-dot" style="background:var(--green);"></span>強気 ${pos}</div>
              <div class="legend-item"><span class="legend-dot" style="background:var(--red);"></span>弱気 ${neg}</div>
              <div class="legend-item"><span class="legend-dot" style="background:var(--gray);"></span>中立 ${neu}</div>
            </div>
          </div>
          <div class="heat-row">
            <span class="muted">強気密度</span>${heatDots(Math.round(avgBull / 20), "green")}
          </div>
          <div class="heat-row">
            <span class="muted">弱気密度</span>${heatDots(Math.round(avgBear / 20), "red")}
          </div>
        </article>
        <article class="card" style="flex:1 1 340px;">
          <h3>カテゴリ注目度</h3>
          <div class="muted">件数は話題の多さです。良し悪しは強気・弱気ラベルで判断します。</div>
          <div class="bar-list">
            ${topCats.map(item => `
              <div class="bar-row">
                <div class="bar-label">${escapeHtml(item.icon || "•")} ${escapeHtml(item.label)}</div>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${(item.news_count / maxCount) * 100}%; background:linear-gradient(90deg, var(--blue), var(--cyan));"></div>
                </div>
                <div class="bar-value">${item.news_count}</div>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function renderCategorySummary(categories) {

    function renderWatchlist(items) {
      document.getElementById("watchlist-summary").innerHTML = items.map(item => `
        <article class="card">

            ${scoreTile("🔴", "弱気", item.bearish_avg, "negative", "銘柄逆風")}
            ${scoreTile("📰", "件数", item.related_news_count, "neutral", item.coverage_note || "材料範囲")}

          </div>
          <div class="news-meta">
            ${badge(`📰 ${item.related_news_count}`)}
            ${badge(`${item.coverage_note}`, "bg-neutral")}
            ${badge(`🟢 ${item.positive_count}`, "bg-positive")}
            ${badge(`🔴 ${item.negative_count}`, "bg-negative")}
            ${badge(`${item.assist_label}`, toneBgClass(item.sentiment_hint))}
          </div>
          <div class="muted" style="margin-top:8px;">短期見通し: ${escapeHtml(item.short_term_outlook)}</div>
          <div class="muted">中期見通し: ${escapeHtml(item.mid_term_outlook)}</div>

    function renderAlerts(alerts) {
      const root = document.getElementById("alerts-summary");
      root.innerHTML = "";
    }

    function applyNewsFilters(news) {
      let rows = [...news];
      rows.sort((a, b) => String(b.published_at).localeCompare(String(a.published_at)));
      return rows;
    }

    function renderNewsList(news) {
      const rows = applyNewsFilters(news);
      const visible = rows.slice(0, 12);
      const remain = Math.max(rows.length - visible.length, 0);
      document.getElementById("news-list").innerHTML = `
      <div class="compact-list">
      ${visible.map(item => `
        <article class="news-item ${escapeHtml(item.sentiment)}">
          <div class="headline">
            <div class="headline-icon">${escapeHtml(item.primary_icon || "📰")}</div>
            <div style="flex:1 1 auto; min-width:0;">
              <div class="summary-title"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.display_title || item.title)}</a></div>
            </div>
          </div>
          <div class="muted">${escapeHtml(item.source_name || "-")} / ${escapeHtml(formatDateShort(item.published_at || "-"))}</div>
          <div class="news-meta">
            ${badge(`${sentimentIcon[item.sentiment] || "⚪"} ${item.sentiment === "positive" ? "追い風" : item.sentiment === "negative" ? "逆風" : "中立"}`, toneBgClass(item.sentiment))}
            ${badge(`🔥 影響 ${item.impact}`, item.impact === "high" ? "bg-high" : "")}
            ${badge(`⏳ ${item.time_horizon}`)}
            ${badge(`B${item.bullish_score} / S${item.bearish_score}`, "bg-neutral")}
          </div>
          ${gaugeHtml(item.bullish_score, item.bearish_score)}
          <div class="news-one-line">
            <strong>判断:</strong> ${escapeHtml(item.stock_price_impact || "未生成")} / 
            <strong>需給:</strong> ${escapeHtml(item.supply_constraint_impact || "未生成")}
          </div>
          <div class="news-one-line">${escapeHtml(item.real_demand_impact || (item.summary_3lines || [])[1] || "")}</div>
          <div class="news-one-line" style="color:#b7c6d5;">注意: ${escapeHtml(item.counter_view || "未生成")}</div>
        </article>
      `).join("")}
      </div>
      ${remain > 0 ? `<button class="show-more" onclick="alert('残り ${remain} 件は一覧を圧縮表示しています。必要ならフィルタで絞ってください。')">残り ${remain} 件は圧縮</button>` : ""}
      `;
    }

    function loadDashboard(payload) {
      state.payload = payload;
      document.getElementById("updated-at").textContent = `更新: ${formatDateShort(payload.generated_at)}`;
      renderIranBriefing(payload.iran_briefing);
      renderBojBriefing(payload.boj_briefing);
      renderTopSummary(payload.summary);
      renderVisualSummary(payload);
      renderCategorySummary(payload.categories);
      renderWatchlist(payload.watchlist_impact);
      renderAlerts(payload.alerts);
      renderNewsList(payload.news);
    }

    async function triggerRefresh() {
      const status = document.getElementById("refresh-status");
      status.textContent = "ページを再読み込みしました";
      window.location.reload();
    }

    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
    });
    document.getElementById("refresh-button").addEventListener("click", triggerRefresh);
    loadDashboard(initialPayload);
  </script>
</body>
