      line-height: 1.6;
      color: #e7f0f7;

    .summary-title {

      height: 100%;

      left: 0;

    .mini-gauge-neg {
      right: 0;
      background: linear-gradient(90deg, var(--red), #9f2d2d);
    }

      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);

      justify-content: space-between;
      gap: 8px;

    .news-one-line {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #d9e5ef;
    }

      width: 100%;

      margin-top: 14px;

      border: 1px solid rgba(255,255,255,0.05);

      color: var(--muted);

      font-weight: 800;
      line-height: 1.2;

      color: #d5e1ec;
      line-height: 1.6;

      gap: 10px;
      align-items: center;

    .bar-label {

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .bar-track {

      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .bar-value {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .donut {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: relative;
      flex: 0 0 96px;
    }
    .donut::after {
      content: "";
      position: absolute;
      inset: 18px;
      background: var(--panel);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }

      gap: 8px;

    }

      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #dce7f1;
    }

      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }

      color: #d7e2ed;

  </style>

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (s) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s]));
    }

    function formatDateShort(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hours = String(date.getHours());
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${year}/${month}/${day} ${hours}:${minutes}`;
    }

    function badge(label, cls = "") {
      return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
    }

    function scoreTile(icon, cap, value, tone = "neutral", note = "") {
      return `
        <div class="signal-chip">
          <div class="cap">${escapeHtml(icon)} ${escapeHtml(cap)}</div>
          <div class="val ${toneClass(tone)}">${escapeHtml(value)}</div>
          <div class="note">${escapeHtml(note)}</div>
        </div>
      `;
    }

    function heatDots(value, mode = "green") {
      const safe = Math.max(0, Math.min(5, Number(value || 0)));
      return `
        <span class="heat-dots">
          ${Array.from({ length: 5 }).map((_, idx) => `<span class="heat-dot ${idx < safe ? `on ${mode}` : ""}"></span>`).join("")}
        </span>
      `;
    }

    function setActiveTab(tabName) {
      document.querySelectorAll(".tab-button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.getElementById("tab-overview").classList.toggle("hidden", tabName !== "overview");
      document.getElementById("tab-news").classList.toggle("hidden", tabName !== "news");
      document.getElementById("tab-watchlist").classList.toggle("hidden", tabName !== "watchlist");
    }

    function gaugeHtml(bull, bear) {
      const safeBull = Math.max(0, Number(bull || 0));
      const safeBear = Math.max(0, Number(bear || 0));
      const total = Math.max(safeBull + safeBear, 1);
      const posWidth = (safeBull / total) * 100;
      const negWidth = (safeBear / total) * 100;
      return `
        <div class="mini-gauge">
          <div class="mini-gauge-pos" style="width:${posWidth}%;"></div>
          <div class="mini-gauge-neg" style="width:${negWidth}%;"></div>
        </div>
        <div class="gauge-caption">
          <span>🟢 強気 ${safeBull}</span>
          <span>🔴 弱気 ${safeBear}</span>
        </div>
      `;
    }

            ${badge(`🔥 影響 ${item.impact}`, item.impact === "high" ? "bg-high" : "")}
            ${badge(`⏳ ${item.time_horizon}`)}
            ${badge(`B${item.bullish_score} / S${item.bearish_score}`, "bg-neutral")}
          </div>
          ${gaugeHtml(item.bullish_score, item.bearish_score)}
          <div class="news-one-line">
            <strong>判断:</strong> ${escapeHtml(item.stock_price_impact || "未生成")} / 
            <strong>需給:</strong> ${escapeHtml(item.supply_constraint_impact || "未生成")}
          </div>
          <div class="news-one-line">${escapeHtml(item.real_demand_impact || (item.summary_3lines || [])[1] || "")}</div>
          <div class="news-one-line" style="color:#b7c6d5;">注意: ${escapeHtml(item.counter_view || "未生成")}</div>
        </article>
      `).join("")}
      </div>
      ${remain > 0 ? `<button class="show-more" onclick="alert('残り ${remain} 件は一覧を圧縮表示しています。必要ならフィルタで絞ってください。')">残り ${remain} 件は圧縮</button>` : ""}
      `;
    }

    function loadDashboard(payload) {
      state.payload = payload;
      document.getElementById("updated-at").textContent = `更新: ${formatDateShort(payload.generated_at)}`;
      renderIranBriefing(payload.iran_briefing);
      renderBojBriefing(payload.boj_briefing);
      renderTopSummary(payload.summary);
      renderVisualSummary(payload);
      renderCategorySummary(payload.categories);
      renderWatchlist(payload.watchlist_impact);
      renderAlerts(payload.alerts);
      renderNewsList(payload.news);
    }

    async function triggerRefresh() {
      const status = document.getElementById("refresh-status");
      status.textContent = "ページを再読み込みしました";
      window.location.reload();
    }

    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
    });
    document.getElementById("refresh-button").addEventListener("click", triggerRefresh);
    loadDashboard(initialPayload);
  </script>
</body>
</html>
