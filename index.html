<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a12" />
  <title>くるくる時計 | 小学生向け時計学習</title>
  <meta name="description" content="長針を指で回して時刻と時間差を学べる、低学年向けの時計学習Webアプリです。" />
  <style>
    :root {
      --bg: #070a12;
      --panel: rgba(13, 20, 37, 0.86);
      --panel-border: rgba(127, 191, 255, 0.22);
      --text: #f4f7fb;
      --muted: #9fb0ca;
      --cyan: #65e8ff;
      --pink: #ff6fd8;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(93, 124, 255, 0.38), transparent 33rem),
        radial-gradient(circle at bottom right, rgba(255, 111, 216, 0.22), transparent 30rem),
        linear-gradient(145deg, #050712 0%, #0b1020 52%, #050712 100%);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }

    .hero-card {
      width: min(100%, 760px);
      min-height: min(780px, calc(100svh - 28px));
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      padding: clamp(18px, 5vw, 40px);
      border: 1px solid var(--panel-border);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 42%), var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(18px);
    }

    .title-area { text-align: center; }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 5.5vw, 2.8rem);
      line-height: 1.18;
    }

    .clock {
      width: min(82vw, 430px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      touch-action: none;
      user-select: none;
      cursor: grab;
      outline: none;
    }

    .clock.dragging { cursor: grabbing; }
    .clock:focus-visible {
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(101, 232, 255, 0.3);
    }

    .clock svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.45));
    }

    .clock-face {
      fill: #10192e;
      stroke: rgba(101, 232, 255, 0.72);
      stroke-width: 5;
    }

    .clock-glow {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 18;
    }

    .mark {
      stroke: rgba(244, 247, 251, 0.48);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .mark.major {
      stroke: var(--gold);
      stroke-width: 5;
    }

    .number {
      fill: #f7fbff;
      font-size: 26px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .hour-hand, .minute-hand { stroke-linecap: round; }
    .hour-hand { stroke: #f7fbff; stroke-width: 14; }
    .minute-hand { stroke: var(--cyan); stroke-width: 8; }
    .center-pin { fill: var(--pink); stroke: #fff; stroke-width: 3; }
    .drag-knob { fill: var(--cyan); stroke: #ffffff; stroke-width: 5; }

    .readout {
      width: min(100%, 470px);
      min-height: 122px;
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px solid rgba(101, 232, 255, 0.18);
      border-radius: 26px;
      background: rgba(3, 8, 20, 0.45);
      text-align: center;
    }

    .readout .label {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 800;
    }

    .readout strong {
      font-size: clamp(2.35rem, 11vw, 4.4rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .readout .sub-time {
      margin-top: 6px;
      color: var(--cyan);
      font-size: clamp(1.05rem, 4.4vw, 1.45rem);
      font-weight: 900;
    }

    .readout p {
      margin: 7px 0 0;
      color: #d9e5f6;
      font-size: clamp(1rem, 4.2vw, 1.35rem);
      font-weight: 700;
    }

    .readout b { color: var(--gold); }

    .button-row {
      width: min(100%, 470px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 58px;
      padding: 12px 14px;
      border: 0;
      border-radius: 18px;
      color: #06101b;
      background: linear-gradient(135deg, var(--cyan), #97f6ff);
      box-shadow: 0 14px 30px rgba(101, 232, 255, 0.2);
      font: inherit;
      font-size: clamp(0.95rem, 3.4vw, 1.1rem);
      font-weight: 900;
    }

    button:active { transform: translateY(1px) scale(0.99); }

    .secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.11);
      box-shadow: none;
    }

    button:disabled {
      color: rgba(255, 255, 255, 0.38);
      background: rgba(255, 255, 255, 0.06);
    }

    @media (max-width: 520px) {
      .hero-card {
        min-height: calc(100svh - 24px);
        border-radius: 26px;
        gap: 14px;
      }

      .clock { width: min(91vw, 370px); }
      .button-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="hero-card" aria-label="時計学習アプリ">
      <div class="title-area">
        <p class="eyebrow">くるくる時計</p>
        <h1>長い針をまわして、時間を読もう</h1>
      </div>

      <div id="clock" class="clock" role="slider" aria-label="長針を動かして時刻を変える" tabindex="0">
        <svg viewBox="0 0 330 330" aria-hidden="true">
          <circle class="clock-face" cx="165" cy="165" r="156"></circle>
          <circle class="clock-glow" cx="165" cy="165" r="151"></circle>
          <g id="marks"></g>
          <g id="numbers"></g>
          <line id="hourHand" class="hour-hand" x1="165" y1="165" x2="165" y2="87"></line>
          <line id="minuteHand" class="minute-hand" x1="165" y1="165" x2="165" y2="43"></line>
          <circle class="center-pin" cx="165" cy="165" r="10"></circle>
          <circle id="dragKnob" class="drag-knob" cx="165" cy="43" r="19"></circle>
        </svg>
      </div>

      <div class="readout" aria-live="polite">
        <span class="label">いまの時刻</span>
        <strong id="timeText">8時00分</strong>
        <div id="time12Text" class="sub-time">12時間表記：午前8時00分</div>
        <p id="diffText" hidden></p>
      </div>

      <div class="button-row">
        <button id="setBase" type="button">この時刻を基点にする</button>
        <button id="clearBase" type="button" class="secondary" disabled>時間差をクリア</button>
      </div>
    </section>
  </main>

  <script>
    const CLOCK_SIZE = 330;
    const CENTER = CLOCK_SIZE / 2;
    const HAND_RADIUS = 122;
    const HOUR_HAND_RADIUS = 78;
    let minutes = 8 * 60;
    let baseMinutes = null;
    let isDragging = false;

    const clock = document.getElementById("clock");
    const marks = document.getElementById("marks");
    const numbers = document.getElementById("numbers");
    const hourHand = document.getElementById("hourHand");
    const minuteHand = document.getElementById("minuteHand");
    const dragKnob = document.getElementById("dragKnob");
    const timeText = document.getElementById("timeText");
    const time12Text = document.getElementById("time12Text");
    const diffText = document.getElementById("diffText");
    const setBase = document.getElementById("setBase");
    const clearBase = document.getElementById("clearBase");

    function normalizeMinutes(value) {
      return ((value % 1440) + 1440) % 1440;
    }

    function formatTime(totalMinutes) {
      const normalized = normalizeMinutes(totalMinutes);
      const hour = Math.floor(normalized / 60);
      const minute = normalized % 60;
      return `${hour}時${String(minute).padStart(2, "0")}分`;
    }

    function formatTime12(totalMinutes) {
      const normalized = normalizeMinutes(totalMinutes);
      const hour24 = Math.floor(normalized / 60);
      const minute = normalized % 60;
      const period = hour24 < 12 ? "午前" : "午後";
      const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
      return `${period}${hour12}時${String(minute).padStart(2, "0")}分`;
    }

    function formatDiff(from, to) {
      const diff = normalizeMinutes(to - from);
      const hour = Math.floor(diff / 60);
      const minute = diff % 60;
      return `${hour}時間${String(minute).padStart(2, "0")}分`;
    }

    function angleToPoint(angle, radius) {
      const rad = ((angle - 90) * Math.PI) / 180;
      return {
        x: CENTER + Math.cos(rad) * radius,
        y: CENTER + Math.sin(rad) * radius,
      };
    }

    function createSvgElement(name, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, String(value));
      }
      return el;
    }

    for (let index = 0; index < 60; index++) {
      const isMajor = index % 5 === 0;
      const outer = angleToPoint(index * 6, 148);
      const inner = angleToPoint(index * 6, isMajor ? 131 : 140);
      marks.appendChild(createSvgElement("line", {
        x1: inner.x, y1: inner.y, x2: outer.x, y2: outer.y,
        class: isMajor ? "mark major" : "mark",
      }));
    }

    for (let index = 1; index <= 12; index++) {
      const point = angleToPoint(index * 30, 113);
      const text = createSvgElement("text", { x: point.x, y: point.y, class: "number" });
      text.textContent = index;
      numbers.appendChild(text);
    }

    function render() {
      const minute = minutes % 60;
      const hour = Math.floor(minutes / 60) % 12;
      const minuteEnd = angleToPoint(minute * 6, HAND_RADIUS);
      const hourEnd = angleToPoint((hour + minute / 60) * 30, HOUR_HAND_RADIUS);

      hourHand.setAttribute("x2", hourEnd.x);
      hourHand.setAttribute("y2", hourEnd.y);
      minuteHand.setAttribute("x2", minuteEnd.x);
      minuteHand.setAttribute("y2", minuteEnd.y);
      dragKnob.setAttribute("cx", minuteEnd.x);
      dragKnob.setAttribute("cy", minuteEnd.y);
      timeText.textContent = formatTime(minutes);
      time12Text.textContent = `12時間表記：${formatTime12(minutes)}`;
      clock.setAttribute("aria-valuetext", `${formatTime(minutes)}、${formatTime12(minutes)}`);

      if (baseMinutes === null) {
        diffText.hidden = true;
        diffText.textContent = "";
        clearBase.disabled = true;
      } else {
        diffText.hidden = false;
        diffText.innerHTML = `基点 ${formatTime(baseMinutes)}（${formatTime12(baseMinutes)}）から<br><b>${formatDiff(baseMinutes, minutes)}</b>`;
        clearBase.disabled = false;
      }
    }

    function updateFromPointer(clientX, clientY) {
      const rect = clock.getBoundingClientRect();
      const x = clientX - rect.left - rect.width / 2;
      const y = clientY - rect.top - rect.height / 2;
      const rawAngle = Math.atan2(y, x) * 180 / Math.PI + 90;
      const minute = Math.round((((rawAngle % 360) + 360) % 360) / 6) % 60;
      const currentMinute = minutes % 60;
      const delta = minute - currentMinute;
      const wrappedDelta = delta > 30 ? delta - 60 : delta < -30 ? delta + 60 : delta;
      minutes = normalizeMinutes(minutes + wrappedDelta);
      render();
    }

    clock.addEventListener("pointerdown", (event) => {
      clock.setPointerCapture(event.pointerId);
      isDragging = true;
      clock.classList.add("dragging");
      updateFromPointer(event.clientX, event.clientY);
    });

    clock.addEventListener("pointermove", (event) => {
      if (isDragging) updateFromPointer(event.clientX, event.clientY);
    });

    function stopDragging() {
      isDragging = false;
      clock.classList.remove("dragging");
    }

    clock.addEventListener("pointerup", stopDragging);
    clock.addEventListener("pointercancel", stopDragging);

    clock.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "ArrowUp") {
        minutes = normalizeMinutes(minutes + 1);
        render();
      }
      if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
        minutes = normalizeMinutes(minutes - 1);
        render();
      }
    });

    setBase.addEventListener("click", () => {
      baseMinutes = minutes;
      render();
    });

    clearBase.addEventListener("click", () => {
      baseMinutes = null;
      render();
    });

    render();
  </script>
</body>
</html>
