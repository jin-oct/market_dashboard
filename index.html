<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Infra News Dashboard</title>
  <style>
    :root {
      --bg: #071019;
      --panel: #0f1823;
      --panel-2: #152131;
      --line: #24384d;
      --text: #edf5fb;
      --muted: #8fa8bb;
      --green: #33d17a;
      --red: #ff6b6b;
      --gray: #94a3b8;
      --amber: #ffbf69;
      --cyan: #66d9ef;
      --blue: #5da9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Yu Gothic UI", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #05080c 0%, #0a1017 100%);
    }
    a { color: #8fd4ff; text-decoration: none; }
    .shell { width: min(1380px, calc(100vw - 18px)); margin: 0 auto; padding: 12px 0 28px; }
    .hero, .card, .table-card {
      background: rgba(12, 18, 26, 0.98);
      border: 1px solid var(--line);
      margin-bottom: 12px;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .hero { padding: 16px; }
    .title-row, .toolbar, .chips, .grid, .summary-grid, .watch-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title-row { align-items: end; justify-content: space-between; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0.03em; }
    h2 { margin: 0; font-size: 16px; }
    h3 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.02em; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .hero-note { margin-top: 10px; font-size: 13px; color: #d6e2ef; line-height: 1.65; }
    .toolbar { margin-top: 14px; align-items: center; justify-content: space-between; }
    .top-tabs {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
      flex-wrap: wrap;
    }
    .tab-button {
      background: #0d151f;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .tab-button.active {
      color: var(--text);
      background: #162434;
      border-color: #3e6387;
    }
    .tab-pane.hidden { display: none; }
    button, select {
      background: #0d151f;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px 12px;
      font-size: 12px;
    }
    button { cursor: pointer; }
    .primary { background: #113d2a; border-color: #1c6d49; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      font-size: 11px;
      color: var(--text);
      background: rgba(255,255,255,0.03);
      border-radius: 2px;
    }
    .grid > .card, .summary-grid > .card, .watch-grid > .card { flex: 1 1 260px; min-width: 0; }
    .card, .table-card { padding: 14px; }
    .number { font-size: 24px; font-weight: 700; }
    .tone-positive { color: var(--green); }
    .tone-negative { color: var(--red); }
    .tone-neutral { color: var(--gray); }
    .alert-card {
      border-color: rgba(255,107,107,0.45);
      background: rgba(39, 16, 21, 0.98);
    }
    .news-item {
      border-left: 6px solid var(--gray);
      border-radius: 2px;
    }
    .news-item.positive { border-left-color: var(--green); }
    .news-item.negative { border-left-color: var(--red); }
    .news-item.neutral { border-left-color: var(--gray); }
    .alert-item, .news-item, .watch-item {
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
      margin-top: 10px;
    }
    .news-meta, .watch-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .news-title { font-size: 15px; font-weight: 700; line-height: 1.5; }
    .news-lines { margin-top: 8px; display: grid; gap: 6px; font-size: 13px; line-height: 1.6; color: #d7e2ed; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      border-radius: 2px;
    }
    .bg-positive { background: rgba(51,209,122,0.16); color: #a9f1c7; border-color: rgba(51,209,122,0.32); }
    .bg-negative { background: rgba(255,107,107,0.16); color: #ffc0c0; border-color: rgba(255,107,107,0.32); }
    .bg-neutral { background: rgba(148,163,184,0.14); color: #d7e1ea; border-color: rgba(148,163,184,0.28); }
    .bg-high { background: rgba(255,191,105,0.16); color: #ffe0b3; border-color: rgba(255,191,105,0.28); }
    .simple-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .simple-box {
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 2px;
    }
    .simple-box .label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .simple-box .value {
      font-size: 14px;
      line-height: 1.6;
      color: #e7f0f7;
    }
    .raw-link {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .headline {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .company-icon {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 4px;
      flex: 0 0 34px;
    }
    .headline-icon {
      font-size: 22px;
      line-height: 1;
      margin-top: 2px;
    }
    .summary-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }
    .compact-list {
      display: grid;
      gap: 10px;
    }
    .mini-gauge {
      margin-top: 8px;
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .mini-gauge-pos, .mini-gauge-neg {
      position: absolute;
      top: 0;
      height: 100%;
    }
    .mini-gauge-pos {
      left: 0;
      background: linear-gradient(90deg, #1f8f56, var(--green));
    }
    .mini-gauge-neg {
      right: 0;
      background: linear-gradient(90deg, var(--red), #9f2d2d);
    }
    .gauge-caption {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .news-one-line {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #d9e5ef;
    }
    .show-more {
      margin-top: 12px;
      width: 100%;
    }
    .hero-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .signal-panel {
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 2px;
    }
    .signal-panel .kicker {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .signal-panel .main {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
    }
    .signal-panel .sub {
      margin-top: 6px;
      font-size: 12px;
      color: #d5e1ec;
      line-height: 1.6;
    }
    .bar-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 120px 1fr 54px;
      gap: 10px;
      align-items: center;
    }
    .bar-label {
      font-size: 12px;
      color: #dfe9f3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      height: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .bar-value {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .donut {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: relative;
      flex: 0 0 96px;
    }
    .donut::after {
      content: "";
      position: absolute;
      inset: 18px;
      background: var(--panel);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .legend {
      display: grid;
      gap: 8px;
      min-width: 160px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #dce7f1;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .footer { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .briefing-card {
      border-color: rgba(255, 191, 105, 0.35);
      background: rgba(19, 18, 14, 0.98);
    }
    .impact-band {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .impact-tile {
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .impact-tile::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--gray);
    }
    .impact-tile.positive::before { background: var(--green); }
    .impact-tile.negative::before { background: var(--red); }
    .impact-tile.neutral::before { background: var(--gray); }
    .impact-tile .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .impact-tile .big {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }
    .impact-tile .tiny {
      margin-top: 6px;
      font-size: 11px;
      color: #d7e2ed;
      line-height: 1.5;
    }
    .signal-ribbon {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .signal-chip {
      min-width: 112px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 2px;
      background: rgba(255,255,255,0.03);
    }
    .signal-chip .cap {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .signal-chip .val {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
    }
    .signal-chip .note {
      margin-top: 4px;
      font-size: 11px;
      color: #d7e2ed;
    }
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .summary-strip .card {
      margin-bottom: 0;
      padding: 12px;
      background: rgba(255,255,255,0.025);
    }
    .heat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .heat-dots {
      display: inline-flex;
      gap: 4px;
    }
    .heat-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .heat-dot.on.green { background: var(--green); }
    .heat-dot.on.red { background: var(--red); }
    .heat-dot.on.gray { background: var(--gray); }
    .briefing-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .briefing-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .briefing-line {
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 2px;
      font-size: 13px;
      line-height: 1.6;
      color: #dce6ef;
    }
    .pm-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .pm-row:last-child { border-bottom: 0; }
    .pm-prob {
      font-size: 20px;
      font-weight: 800;
      text-align: right;
    }
    .hidden { display: none; }
    .status { font-size: 12px; color: var(--muted); }
    @media (max-width: 820px) {
      .shell { width: min(100vw - 10px, 1380px); }
      h1 { font-size: 22px; }
      .toolbar { align-items: stretch; }
      .toolbar > div { width: 100%; }
      button, select { width: 100%; }
      .briefing-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

      const safe = Math.max(0, Math.min(5, Number(value || 0)));
      return `

    function gaugeHtml(bull, bear) {
      const safeBull = Math.max(0, Number(bull || 0));
      const safeBear = Math.max(0, Number(bear || 0));
      const total = Math.max(safeBull + safeBear, 1);
      const posWidth = (safeBull / total) * 100;
      const negWidth = (safeBear / total) * 100;
      return `
        <div class="mini-gauge">
          <div class="mini-gauge-pos" style="width:${posWidth}%;"></div>
          <div class="mini-gauge-neg" style="width:${negWidth}%;"></div>
        </div>
        <div class="gauge-caption">
          <span>🟢 強気 ${safeBull}</span>
          <span>🔴 弱気 ${safeBear}</span>
        </div>
      `;

      document.getElementById("updated-at").textContent = `更新: ${formatDateShort(payload.generated_at)}`;
      renderIranBriefing(payload.iran_briefing);
      renderBojBriefing(payload.boj_briefing);
      renderTopSummary(payload.summary);
      renderVisualSummary(payload);
      renderCategorySummary(payload.categories);
      renderWatchlist(payload.watchlist_impact);
      renderAlerts(payload.alerts);
      renderNewsList(payload.news);
    }

    async function triggerRefresh() {
      const status = document.getElementById("refresh-status");
      status.textContent = "ページを再読み込みしました";
      window.location.reload();
    }

    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
    });
    document.getElementById("refresh-button").addEventListener("click", triggerRefresh);
    loadDashboard(initialPayload);
  </script>
</body>
</html>
